apiVersion: v1
kind: Service

metadata:
  name: postgres

spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432


---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: postgres
          image: ghcr.io/polyakofff/walking-recommender-postgres:16

          ports:
            - containerPort: 5432

          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"

          env:
            - name: POSTGRES_DB
              value: walking_recommender

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: walker-db
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: walker-db
                  key: password

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999

            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data