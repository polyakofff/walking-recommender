spring.application.name=walking-recommender

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/walking_recommender}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

#logging

#walking-recommender
walking-recommender.edge-segment-max-meters=20
walking-recommender.within-objects-radius-meters=300

walking-recommender.scenic-weight = 0.9

walking-recommender.route-difference-threshold-ratio=0.9

walking-recommender.route-attractiveness-coef=1.0
walking-recommender.route-duration-error-coef=1.0
walking-recommender.route-repeated-distance-error-coef=1.0
walking-recommender.route-reverse-distance-error-coef=3.0
walking-recommender.route-smoothness-coef=0.3

walking-recommender.generator-direct-distance-factor=1.5

walking-recommender.candidate-distance-meters=150

walking-recommender.waypoint-scorer-time-weight=0.5

walking-recommender.waypoint-selector-distance-meters=100

walking-recommender.waypoint-generator-limit=500
walking-recommender.waypoint-generator-pairs-limit=500
